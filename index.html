<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謝師宴檔期重調查</title>
    <style>
        :root { --primary: #1a2a3a; --accent: #e63946; --admin-blue: #3a86ff; }
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-container { background: #fff; width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .restaurant-banner { background: #1a2a3a; color: #d4af37; padding: 15px; text-align: center; font-weight: bold; border-radius: 10px; margin-bottom: 20px; }
        .vote-card { padding: 20px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 10px; cursor: pointer; text-align: center; font-weight: bold; }
        .vote-card.selected { border-color: var(--admin-blue); background: #e0f2fe; }
        .map-container { width: 100%; height: 150px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .cal-day { padding: 10px 0; border: 1px solid #eee; text-align: center; border-radius: 5px; font-size: 13px; cursor: pointer; }
        .cal-day.disabled { background: #e2e8f0; cursor: not-allowed; color: #94a3b8; }
        .cal-day.unavailable { background: #fee2e2; border-color: #fca5a5; }
        .month-title { font-weight: bold; margin: 20px 0 10px 0; color: #1a2a3a; }
        button { width: 100%; padding: 15px; background: #1a2a3a; color: #fff; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="login-screen">
        <input type="text" id="studentName" placeholder="輸入姓名">
        <button onclick="verifyName()">開始</button>
    </div>

    <!-- 場地投票 -->
    <div id="venue-screen" style="display:none;">
        <div class="restaurant-banner">請先選擇場地</div>
        <div class="vote-card" onclick="selectVenue('巨城店')">新竹巨城店</div>
        <div class="vote-card" onclick="selectVenue('享平方店')">享平方店</div>
    </div>

    <!-- 日曆調查 -->
    <div id="calendar-screen" style="display:none;">
        <div class="restaurant-banner">餐廳確認：金色三麥</div>
        <div class="map-container"><iframe src="https://maps.google.com/maps?q=金色三麥+新竹巨城店PARK15&output=embed" width="100%" height="100%"></iframe></div>
        <a href="https://www.google.com/maps/dir/?api=1&destination=金色三麥+新竹巨城店PARK15" target="_blank">一鍵開啟導航</a>
        <div id="calendar-container"></div>
        <button onclick="submitData()">儲存請假日期</button>
    </div>
</div>

<script>
    const gasURL = '...'; // 填入你的 GAS 連結
    let currentName = '', venue = '', unavailableData = {};

    function isDateDisabled(m, d) {
        if (m === 6) return d < 5 || [8, 9, 12, 22, 23].includes(d);
        if (m === 7) return (d >= 1 && d <= 19) || [24, 25].includes(d);
        return false;
    }

    function verifyName() {
        // fetch 後判斷 if (!data.venue) showVenueScreen(); else showCalendarScreen();
    }
    
    function selectVenue(v) {
        venue = v;
        fetch(gasURL, { method: 'POST', body: JSON.stringify({ action: 'submit', actionType: 'vote', name: currentName, venue: v }) })
        .then(() => showCalendarScreen());
    }

    function showCalendarScreen() {
        document.getElementById('venue-screen').style.display = 'none';
        document.getElementById('calendar-screen').style.display = 'block';
        // 渲染 6, 7, 8 月日曆...
    }
</script>
</body>
</html>
