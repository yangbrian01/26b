<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026TCLIPb 謝師宴決選</title>
    <style>
        :root { --primary: #1a2a3a; --accent: #e63946; --bg: #f0f2f5; --text: #2b2d42; --surface: rgba(255, 255, 255, 0.95); --gold: #d4af37; --admin-blue: #3a86ff; }
        
        * { box-sizing: border-box; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .app-container { background: var(--surface); width: 100%; max-width: 550px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); backdrop-filter: blur(10px); margin-bottom: 20px; }
        
        /* 金色三麥大橫幅 */
        .restaurant-banner { background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 100%); color: var(--gold); padding: 20px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid var(--gold); letter-spacing: 1px; }
        
        .header-title { text-align: center; margin-top: 0; margin-bottom: 5px; color: var(--primary); font-weight: 800; font-size: 28px; letter-spacing: 1px; }
        .sub-title { text-align: center; color: #8d99ae; font-size: 15px; margin-bottom: 20px; margin-top: 0; font-weight: 500; }
        
        .deadline-banner { background: #ffe3e3; color: var(--accent); padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 15px; margin-bottom: 20px; display: none; border: 2px solid #ffc2d1; }
        
        input[type="text"], input[type="datetime-local"] { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #edf2f4; border-radius: 12px; font-size: 16px; outline: none; transition: all 0.3s ease; background: #f8f9fa; }
        input[type="text"]:focus, input[type="datetime-local"]:focus { border-color: var(--primary); background: #fff; box-shadow: 0 4px 12px rgba(26, 42, 58, 0.1); transform: translateY(-1px); }
        input:disabled { background: #e9ecef; cursor: not-allowed; opacity: 0.7; }
        
        button { width: 100%; padding: 16px; background-color: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; margin-bottom: 10px; }
        button:hover { background-color: #0f1923; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        button:active { transform: translateY(0); }
        button.secondary { background-color: #edf2f4; color: #457b9d; }
        button.secondary:hover { background-color: #e2eafc; }
        button.admin-btn { background-color: #4a4e69; margin-top: 10px; }
        button.admin-btn:hover { background-color: #22223b; }
        .btn-blue { background-color: var(--admin-blue); }

        @keyframes pulse-btn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 0 12px rgba(230, 57, 70, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
        }
        .pulse-animation { animation: pulse-btn 1.5s infinite; background-color: var(--accent) !important; }
        
        /* 投票卡片樣式 */
        .vote-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .vote-card { padding: 20px; border-radius: 12px; background: #fff; border: 2px solid #edf2f4; cursor: pointer; transition: 0.2s; font-size: 18px; font-weight: bold; color: #495057; display: flex; align-items: center; justify-content: space-between; }
        .vote-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); border-color: #cbd5e1; }
        .vote-card.selected { background: #f0f7ff; border-color: var(--admin-blue); color: var(--admin-blue); box-shadow: 0 4px 12px rgba(58, 134, 255, 0.15); }
        .vote-card.selected::after { content: '✓'; font-size: 24px; font-weight: bold; }
        
        /* 開票進度條 */
        .result-bar-container { background: #edf2f4; border-radius: 8px; height: 28px; width: 100%; margin-top: 8px; position: relative; overflow: hidden; }
        .result-bar { background: var(--admin-blue); height: 100%; width: 0%; transition: width 0.5s ease-out; }
        .result-text { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: bold; color: #fff; mix-blend-mode: difference; }

        .admin-section { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #edf2f4; }
        .admin-label { font-weight: bold; font-size: 14px; color: var(--primary); display: block; margin-bottom: 8px; }
        
        #toast { visibility: hidden; min-width: 260px; background: rgba(33, 37, 41, 0.95); color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, bottom 0.3s; backdrop-filter: blur(4px); }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .app-container { padding: 25px 15px; border-radius: 15px; }
            .header-title { font-size: 24px; }
            button { padding: 14px; font-size: 15px; }
            input[type="text"], input[type="datetime-local"] { padding: 12px; font-size: 14px; }
            .restaurant-banner { font-size: 18px; padding: 15px; }
            .vote-card { font-size: 16px; padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2 class="header-title">2026TCLIPb</h2>
    <p class="sub-title">謝師宴決選投票</p>
    
    <div id="deadline-banner" class="deadline-banner"></div>

    <div id="login-screen">
        <input type="text" id="studentName" placeholder="請輸入你的姓名">
        <button type="button" id="loginBtn" onclick="verifyName()">進入投票</button>
        <div id="loading" style="display: none; text-align: center; margin-top: 15px; color: #8d99ae;">載入資料中，請稍候...</div>
    </div>

    <div id="vote-screen" style="display: none;">
        <div class="restaurant-banner">
            🍻 餐廳決選確認：金色三麥 🍻
        </div>

        <p style="text-align: center; font-size: 16px; margin-bottom: 20px; color: #495057;">
            <strong id="displayName" style="color: var(--primary); font-size: 22px;"></strong><br>
            <span style="font-size: 14px; color: #8d99ae; display: inline-block; margin-top: 8px;">請選擇你 <span style="color: var(--admin-blue); font-weight: 700;">最想去</span> 的一天 (單選)</span>
        </p>
        
        <div id="vote-options-container" class="vote-grid">
            <p style="text-align: center; color: #adb5bd;">管理員尚未設定候選日期</p>
        </div>

        <button type="button" id="submitBtn" onclick="submitData()">送出選票</button>
        <div id="submit-loading" style="display: none; text-align: center; margin-top: 15px; color: #8d99ae;">資料同步中...</div>
        
        <button type="button" id="adminBtn" class="admin-btn" style="display: none;" onclick="fetchAdminData()">📊 切換至開票後台</button>
    </div>

    <div id="admin-screen" style="display: none;">
        <h3 style="color: var(--primary); border-bottom: 3px solid #edf2f4; padding-bottom: 10px; margin-top: 0; text-align: center;">📊 決選開票所</h3>
        
        <div class="admin-section">
            <label class="admin-label">📅 設定候選日期</label>
            <input type="text" id="admin-options-input" placeholder="請用逗號分隔 (例如: 6/20, 6/27, 7/4)">
            <button type="button" class="btn-blue" onclick="saveVotingOptions()" style="padding: 10px; font-size: 14px; margin-bottom: 0;">發布投票選項</button>
        </div>

        <div class="admin-section">
            <label class="admin-label">⏳ 設定截止時間</label>
            <input type="datetime-local" id="admin-deadline-input">
            <button type="button" class="secondary" onclick="saveDeadline()" style="padding: 10px; font-size: 14px; margin-bottom: 0;">儲存截止時間</button>
        </div>

        <h4 style="color: #495057; margin-bottom: 10px;">目前得票統計</h4>
        <div id="admin-results-container" style="margin-bottom: 25px;"></div>

        <button type="button" class="secondary" onclick="exitAdmin()">返回個人投票</button>
    </div>
</div>

<div id="toast"></div>

<script>
    const gasURL = 'https://script.google.com/macros/s/AKfycbwiqBsbsBEL4aNP6OOot1QxU1_m6HxcR4E_vACotQhPriDYaI3fE0fVj8bw8Gk0hJAc/exec'; 
    let currentName = '';
    let globalDeadline = '';
    let globalVotingOptions = [];
    let currentVote = ''; // 紀錄當下選的日期
    let isPastDeadline = false;

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show";
        setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    function checkDeadlineStatus() {
        if (!globalDeadline) return false;
        const now = new Date();
        const parsedStr = globalDeadline.replace('T', ' ').replace(/-/g, '/');
        const d = new Date(parsedStr); 
        if (isNaN(d)) return false;
        return now > d;
    }

    window.onload = function() {
        const savedName = localStorage.getItem('teacherBanquetName');
        if (savedName) {
            document.getElementById('studentName').value = savedName;
            verifyName();
        }
    }

    function verifyName() {
        const nameInput = document.getElementById('studentName').value.trim();
        if (!nameInput) return showToast('請輸入姓名！');

        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        fetch(gasURL, {
            method: 'POST',
            body: JSON.stringify({ action: 'verify', name: nameInput })
        }).then(res => res.json()).then(data => {
            if (data.status === 'success') {
                currentName = nameInput;
                localStorage.setItem('teacherBanquetName', currentName); 
                
                globalDeadline = data.deadline || '';
                globalVotingOptions = data.votingOptions || [];
                currentVote = data.vote || ''; // 讀取之前的投票結果
                
                document.getElementById('displayName').innerText = currentName;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('vote-screen').style.display = 'block';
                
                isPastDeadline = checkDeadlineStatus();
                if (isPastDeadline) {
                    const banner = document.getElementById('deadline-banner');
                    if (globalDeadline.includes('T')) {
                        const [pDate, pTime] = globalDeadline.split('T');
                        const [y, m, d] = pDate.split('-');
                        banner.innerText = `🚨 投票已於 ${m}/${d} ${pTime} 截止。`;
                    } else {
                        banner.innerText = `🚨 投票已截止。`;
                    }
                    banner.style.display = 'block';
                    document.getElementById('submitBtn').style.display = 'none';
                }

                if (data.isAdmin) document.getElementById('adminBtn').style.display = 'block';
                
                renderVotingCards(); // 繪製選票
            } else {
                showToast(data.message);
                resetLoginBtn();
            }
        }).catch(err => {
            showToast('連線失敗，請檢查網路後再試');
            resetLoginBtn();
        });
    }

    function resetLoginBtn() {
        document.getElementById('loginBtn').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
    }

    // ⭐ 繪製單選投票卡片
    function renderVotingCards() {
        const container = document.getElementById('vote-options-container');
        container.innerHTML = '';
        
        if (globalVotingOptions.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #adb5bd;">管理員尚未設定候選日期，請稍候再回來看喔！</p>';
            document.getElementById('submitBtn').style.display = 'none';
            return;
        }
        
        if (!isPastDeadline) document.getElementById('submitBtn').style.display = 'block';

        globalVotingOptions.forEach(dateStr => {
            const card = document.createElement('div');
            card.className = 'vote-card';
            card.innerText = dateStr;
            
            // 如果這張卡片是之前投過的，標記起來
            if (currentVote === dateStr) {
                card.classList.add('selected');
            }
            
            card.onclick = () => {
                if (isPastDeadline) return showToast('🚨 投票已截止囉！');
                
                // 單選邏輯：移除其他人的 selected，加給自己
                document.querySelectorAll('.vote-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                currentVote = dateStr;
                
                document.getElementById('submitBtn').classList.add('pulse-animation');
            };
            container.appendChild(card);
        });
    }

    function submitData() {
        if (isPastDeadline) return showToast('🚨 投票已截止，無法送出');
        if (!currentVote) return showToast('請先選擇一天喔！');
        
        document.getElementById('submitBtn').classList.remove('pulse-animation');
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('submit-loading').style.display = 'block';

        fetch(gasURL, {
            method: 'POST',
            redirect: 'follow',
            body: JSON.stringify({ action: 'submit', name: currentName, vote: currentVote }) // 傳送 vote 欄位
        }).then(res => res.json()).then(data => {
            if (data.status === 'success') {
                showToast('✅ 投票成功送出！');
            } else {
                showToast(data.message); 
            }
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('submit-loading').style.display = 'none';
        }).catch(err => {
            showToast('❌ 傳送失敗，請稍後再試！');
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('submit-loading').style.display = 'none';
        });
    }

    // --- 管理員開票功能 ---
    function fetchAdminData() {
        showToast('讀取開票資料中...');
        fetch(gasURL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getAdminData', name: currentName })
        }).then(res => res.json()).then(data => {
            if (data.status === 'success') {
                globalDeadline = data.deadline || '';
                globalVotingOptions = data.votingOptions || [];
                
                if (globalDeadline) {
                    try {
                        const parsedStr = globalDeadline.replace('T', ' ').replace(/-/g, '/');
                        const d = new Date(parsedStr);
                        if (!isNaN(d)) {
                            const pad = (n) => n < 10 ? '0' + n : n;
                            const formatted = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                            document.getElementById('admin-deadline-input').value = formatted;
                        }
                    } catch(e) {}
                }
                
                document.getElementById('admin-options-input').value = globalVotingOptions.join(', ');

                renderAdminResults(data.data);
            } else {
                showToast(data.message);
            }
        }).catch(() => showToast('讀取失敗'));
    }

    function renderAdminResults(allData) {
        document.getElementById('vote-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        
        // 統計得票數
        const voteCounts = {};
        let totalVotes = 0;
        
        globalVotingOptions.forEach(opt => voteCounts[opt] = 0); // 初始化有在選單裡的
        
        allData.forEach(row => {
            if (row.vote) {
                if (voteCounts[row.vote] !== undefined) {
                    voteCounts[row.vote]++;
                } else {
                    voteCounts[row.vote] = 1; // 防呆：有人投了不在選單上的舊資料
                }
                totalVotes++;
            }
        });

        const container = document.getElementById('admin-results-container');
        container.innerHTML = '';
        
        if (totalVotes === 0) {
            container.innerHTML = '<p style="color: #8d99ae; font-size: 14px;">目前還沒有人投票喔！</p>';
            return;
        }

        // 畫出長條圖
        Object.keys(voteCounts).forEach(opt => {
            const count = voteCounts[opt];
            const percentage = Math.round((count / totalVotes) * 100) || 0;
            
            const item = document.createElement('div');
            item.style.marginBottom = '15px';
            item.innerHTML = `
                <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px;">
                    <span style="font-weight: bold; color: var(--primary);">${opt}</span>
                    <span style="color: #6c757d;">${count} 票 (${percentage}%)</span>
                </div>
                <div class="result-bar-container">
                    <div class="result-bar" style="width: ${percentage}%;"></div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function saveVotingOptions() {
        const valStr = document.getElementById('admin-options-input').value;
        const optsArray = valStr.split(',').map(s => s.trim()).filter(String);
        
        showToast('發布選項中...');
        fetch(gasURL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateSettings', name: currentName, settingType: 'votingOptions', value: optsArray })
        }).then(res => res.json()).then(data => {
            if (data.status === 'success') {
                globalVotingOptions = optsArray;
                showToast('✅ 投票選項已發布！');
            }
        });
    }
    
    function saveDeadline() {
        const val = document.getElementById('admin-deadline-input').value; 
        showToast('儲存設定中...');
        fetch(gasURL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateSettings', name: currentName, settingType: 'deadline', value: val })
        }).then(res => res.json()).then(data => {
            if (data.status === 'success') {
                globalDeadline = val; 
                showToast('✅ 截止時間設定成功！');
            }
        });
    }

    function exitAdmin() {
        document.getElementById('admin-screen').style.display = 'none';
        isPastDeadline = checkDeadlineStatus();
        if (isPastDeadline) {
            const banner = document.getElementById('deadline-banner');
            const parsedStr = globalDeadline.replace('T', ' ').replace(/-/g, '/');
            const d = new Date(parsedStr);
            banner.innerText = `🚨 投票已於 ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes()<10?'0'+d.getMinutes():d.getMinutes()} 截止。`;
            banner.style.display = 'block';
            document.getElementById('submitBtn').style.display = 'none';
        } else {
            document.getElementById('deadline-banner').style.display = 'none';
            if (globalVotingOptions.length > 0) document.getElementById('submitBtn').style.display = 'block';
        }
        renderVotingCards(); 
        document.getElementById('vote-screen').style.display = 'block';
    }
</script>
</body>
</html>
